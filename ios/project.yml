# 用 XcodeGen 生成 Xcode 工程：brew install xcodegen && xcodegen
name: PoseMate
options:
  bundleIdPrefix: com.example.posemate   # TODO: 换成你的域名
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
packages:
  PoseKit:
    path: Packages/PoseKit
targets:
  PoseMate:
    type: application
    platform: iOS
    sources:
      - PoseMate
    dependencies:
      - package: PoseKit
    info:
      path: PoseMate/Info.plist
      properties:
        CFBundleDisplayName: PoseMate
        CFBundleLocalizations: [en, zh-Hans]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "PoseMate uses the camera to guide your pose in real time. Video never leaves your phone."
        NSPhotoLibraryAddUsageDescription: "PoseMate saves the photos you take to your library."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.posemate.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""   # TODO: 填你的 Apple Team ID
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
