<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>姿势搭子 PoseMate</title>
  <meta name="description" content="实时 AI 拍照姿势教练：选姿势，跟着轮廓摆，对上了就变绿。" />
  <meta name="theme-color" content="#141216" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="姿势搭子" />
  <link rel="modulepreload" href="./js/app.js" />
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div id="offline" class="banner" hidden data-i18n="offline"></div>
  <button id="update" class="banner banner-btn" hidden data-i18n="update"></button>

  <main>
    <!-- 拍照 -->
    <section id="view-camera" class="view view-camera">
      <div id="stage" class="stage">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
        <div id="flash" class="flash"></div>

        <div class="topbar">
          <button id="pose-chip" class="pose-chip">
            <span id="pose-chip-thumb" class="mini-thumb"></span>
            <span id="pose-name"></span>
            <span class="chev">›</span>
          </button>
          <div class="top-actions">
            <button id="tips-btn" class="icon-btn" data-i18n-label="camera.tips">
              <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3Z"/></svg>
            </button>
            <button id="flip" class="icon-btn" data-i18n-label="camera.flip">
              <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9.5 13.5a2.5 2.5 0 0 1 4.6-1.4M14.5 12.5a2.5 2.5 0 0 1-4.6 1.4M14 10.5v1.8h-1.8M10 15.5v-1.8h1.8"/></svg>
            </button>
          </div>
        </div>

        <div id="score" class="score" hidden><span id="score-num">0</span><small>%</small></div>
        <div id="model-status" class="model-status" hidden></div>
        <div id="countdown" class="countdown" hidden></div>
        <p id="hint" class="hint" hidden aria-live="polite"></p>

        <div id="start-card" class="start-card">
          <div class="logo-dot big"></div>
          <h1 data-i18n="app.name">姿势搭子</h1>
          <p data-i18n="camera.startLead">跟着轮廓摆姿势，对上了就会变绿。</p>
          <button id="start-btn" class="btn" data-i18n="camera.start">开启相机</button>
          <p id="start-error" class="error" hidden></p>
          <p class="fine" data-i18n="camera.privacy">画面只在你的手机上处理，不会上传。</p>
        </div>
      </div>

      <div class="controls">
        <button id="last-thumb" class="last-thumb" aria-label="photos"></button>
        <button id="shutter" class="shutter" aria-label="shutter"><span></span></button>
        <div class="opts">
          <button id="timer-btn" class="opt" data-i18n-label="camera.timer">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2h4"/></svg><b>off</b>
          </button>
          <button id="auto-btn" class="opt" aria-pressed="true" data-i18n-label="camera.auto">
            <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><b>AUTO</b>
          </button>
        </div>
      </div>
    </section>

    <!-- 姿势库 -->
    <section id="view-library" class="view page" hidden>
      <header class="page-head"><h2 data-i18n="library.title">姿势库</h2></header>
      <div id="chips" class="chips" role="tablist"></div>
      <div id="pose-grid" class="pose-grid"></div>
    </section>

    <!-- 我的 -->
    <section id="view-me" class="view page" hidden>
      <header class="page-head"><h2 data-i18n="me.title">我的</h2></header>
      <h3 data-i18n="me.photos">我的照片</h3>
      <div id="photo-grid" class="photo-grid"></div>
      <p id="photo-empty" class="empty" data-i18n="me.empty"></p>

      <div class="list">
        <div class="row">
          <span data-i18n="me.plan">当前方案</span>
          <span class="row-end"><b id="plan-value"></b>
            <button id="upgrade-btn" class="btn small" data-i18n="me.upgrade">升级 Pro</button>
            <button id="reset-pro" class="link" data-i18n="me.resetPro" hidden></button>
          </span>
        </div>
        <div class="row">
          <span data-i18n="me.language">语言</span>
          <span id="lang-switch" class="seg"><button data-lang="zh">中文</button><button data-lang="en">EN</button></span>
        </div>
        <div id="install-row" class="row col" hidden>
          <span class="row-line"><span data-i18n="me.install">添加到主屏幕</span>
            <button id="install-btn" class="btn small" data-i18n="me.install" hidden></button></span>
          <small id="install-note" class="fine"></small>
        </div>
        <a class="row" href="./privacy.html"><span data-i18n="me.privacy">隐私说明</span><span class="chev">›</span></a>
        <div class="row"><span data-i18n="me.version">版本</span><span id="version" class="fine"></span></div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <a class="tab" href="#camera" data-view="camera">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span data-i18n="tab.camera">拍照</span>
    </a>
    <a class="tab" href="#library" data-view="library">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v7M7 10l5-1 5 1M9 21l3-7 3 7"/></svg>
      <span data-i18n="tab.library">姿势库</span>
    </a>
    <a class="tab" href="#me" data-view="me">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span data-i18n="tab.me">我的</span>
    </a>
  </nav>

  <!-- 姿势小贴士 -->
  <dialog id="tips" class="sheet">
    <div class="sheet-grip"></div>
    <div class="tips-head">
      <div id="tips-thumb" class="pose-thumb small"></div>
      <h3 id="tips-title"></h3>
    </div>
    <h4 data-i18n="tips.subject">给被拍的人</h4>
    <ul id="tips-subject" class="tips"></ul>
    <h4 data-i18n="tips.photographer">给拍照的人</h4>
    <ul id="tips-photographer" class="tips"></ul>
    <div class="coach-stub">
      <h4 data-i18n="tips.coach">AI 教练（即将上线）</h4>
      <p class="fine" data-i18n="tips.coachBody"></p>
    </div>
    <button class="btn ghost wide" data-close data-i18n="photo.close">关闭</button>
  </dialog>

  <!-- 付费墙（占位：网页版订阅未接入） -->
  <dialog id="paywall" class="sheet">
    <div class="sheet-grip"></div>
    <div class="logo-dot big"></div>
    <h3 data-i18n="paywall.title">解锁姿势搭子 Pro</h3>
    <ul class="benefits">
      <li data-i18n="paywall.benefit.library"></li>
      <li data-i18n="paywall.benefit.coach"></li>
      <li data-i18n="paywall.benefit.group"></li>
    </ul>
    <p class="fine center" data-i18n="paywall.soon"></p>
    <button id="paywall-demo" class="btn wide" data-i18n="paywall.demo"></button>
    <button class="btn ghost wide" data-close data-i18n="paywall.close"></button>
  </dialog>

  <!-- 照片查看 -->
  <dialog id="viewer" class="viewer">
    <img id="viewer-img" alt="" />
    <div class="viewer-bar">
      <button class="btn ghost small" data-close data-i18n="photo.close"></button>
      <button id="viewer-delete" class="btn ghost small danger" data-i18n="photo.delete"></button>
      <button id="viewer-share" class="btn ghost small" data-i18n="photo.share"></button>
      <button id="viewer-save" class="btn small" data-i18n="photo.save"></button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
